name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Package and verify
        run: |
          python scripts/build_release.py "$GITHUB_REF_NAME"
          cd dist
          sha256sum --check SHA256SUMS
      - name: Publish experimental release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS --verify-tag --prerelease --title "$GITHUB_REF_NAME — experimental" --notes-file "docs/release-$GITHUB_REF_NAME.md"
